name: Moments Server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - name: Format and lint
        working-directory: server
        run: cargo fmt --check && cargo clippy --locked -- -D warnings
      - name: PostgreSQL integration tests
        run: bash server/tests/run.sh
