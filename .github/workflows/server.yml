name: Server CI
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/server*.yml", "scripts/release.py", "scripts/tests/**", "Makefile", "AGENTS.md"]
  pull_request:
    branches: [main]
    paths: ["server/**", ".github/workflows/server*.yml", "scripts/release.py", "scripts/tests/**", "Makefile", "AGENTS.md"]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: Test, build and verify server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YAYA_REQUIRE_GIT_SHA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Read server build metadata
        id: metadata
        run: python3 scripts/release.py server --github-output "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy && rustup default 1.98.1
      - name: Check formatting
        working-directory: server
        run: cargo fmt --check
      - name: Clippy
        working-directory: server
        env:
          YAYA_GIT_SHA: ${{ steps.metadata.outputs.sha }}
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust unit tests
        working-directory: server
        env:
          YAYA_GIT_SHA: ${{ steps.metadata.outputs.sha }}
        run: cargo test --locked
      - name: Release validation tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: PostgreSQL integration tests
        env:
          YAYA_GIT_SHA: ${{ steps.metadata.outputs.sha }}
          MOMENTS_EXPECTED_SERVER: yaya server ${{ steps.metadata.outputs.display_version }}
        run: bash server/tests/run.sh
      - name: Build release binary
        working-directory: server
        env:
          YAYA_GIT_SHA: ${{ steps.metadata.outputs.sha }}
        run: cargo build --release --locked
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: server
          load: true
          provenance: false
          tags: yayacal-server:ci
          build-args: YAYA_GIT_SHA=${{ steps.metadata.outputs.sha }}
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64
      - name: Docker PostgreSQL and HTTP integration tests
        env:
          MOMENTS_EXPECTED_SERVER: yaya server ${{ steps.metadata.outputs.display_version }}
        run: bash server/tests/run.sh --image yayacal-server:ci
