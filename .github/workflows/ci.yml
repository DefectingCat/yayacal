name: Android CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]*'
    paths-ignore: ["server/**", ".github/workflows/server*.yml"]
  pull_request:
    branches: [ "main" ]
    paths-ignore: ["server/**", ".github/workflows/server*.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test-and-build:
    name: Test & Build Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release validation tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate Android release tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py android "$RELEASE_TAG"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run Spotless Check
        run: ./gradlew spotlessCheck

      - name: Run Unit Tests
        run: ./gradlew :core:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: yayacal-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build & Publish Release
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Android release notes
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py android "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/android-release.md" --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Prepare Release APK
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p release-apk
          cp app/build/outputs/apk/release/*.apk release-apk/yayacal-${TAG_NAME}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-apk/yayacal-*-release.apk
          name: ${{ steps.metadata.outputs.title }}
          body_path: ${{ runner.temp }}/android-release.md
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
