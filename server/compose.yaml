name: yayacal-moments
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: moments
      POSTGRES_USER: moments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U moments -d moments"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    image: ${SERVER_IMAGE:-yayacal-moments-api:local}
    build:
      context: .
      args:
        YAYA_GIT_SHA: ${YAYA_GIT_SHA:-}
    environment:
      DATABASE_URL: postgres://moments:${POSTGRES_PASSWORD}@db/moments
      BIND_ADDR: 0.0.0.0:8088
      MEDIA_DIR: /data/media
      RUST_LOG: ${RUST_LOG:-yayacal_server=info,tower_http=info}
    ports:
      - "127.0.0.1:${PORT:-8088}:8088"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  media:
